const ALL_ACTS_TOTAL = Object.values(ACTIVITIES).reduce((a, c) => a + c.items.length, 0);

function calcLevel(scores) {
  const avg = Object.values(scores).reduce((a, b) => a + b, 0) / Object.values(scores).length;
  if (avg < 2) return 1; if (avg < 3) return 2; if (avg < 4) return 3; if (avg < 4.5) return 4; return 5;
}
function getWeakCats(scores) {
  return Object.entries(scores).filter(([, v]) => v <= 3).sort(([, a], [, b]) => a - b).map(([k]) => k);
}
function calcBadges(allRecords, rec) {
  const earned = [];
  if (allRecords.length >= 1) earned.push('first_survey');
  if (allRecords.length >= 2) earned.push('multi_sem');
  if (rec) {
    const done = Object.values(rec.activities || {}).filter(Boolean).length;
    if (done / ALL_ACTS_TOTAL >= 0.8) earned.push('all_acts');
    if (rec.level === 5) earned.push('level5');
    if (rec.scores?.cardio === 5) earned.push('cardio_star');
    if (rec.scores?.strength === 5) earned.push('strength_star');
    if (rec.scores && Object.values(rec.scores).every(v => v >= 4)) earned.push('all_star');
    if (allRecords.length >= 2) {
      const sorted = [...allRecords].sort((a, b) => new Date(a.survey_date) - new Date(b.survey_date));
      if (sorted[sorted.length - 1].level > sorted[0].level) earned.push('level_up');
    }
  }
  return earned;
}

// ── Supabase API ──
async function loadRecord(grade, name, semester) {
  const { data } = await db.from('fitness_records').select('*').eq('grade', grade).eq('name', name).eq('semester', semester).single();
  return data;
}
async function loadAllRecords(grade, name) {
  const { data } = await db.from('fitness_records').select('*').eq('grade', grade).eq('name', name);
  return data || [];
}
async function saveRecord(grade, name, semester, scores, level, activities) {
  const payload = { grade, name, semester, scores, level, activities, survey_date: new Date().toISOString().split('T')[0], updated_at: new Date().toISOString() };
  await db.from('fitness_records').upsert(payload, { onConflict: 'grade,name,semester' });
}
async function updateActivities(grade, name, semester, activities) {
  await db.from('fitness_records').update({ activities, updated_at: new Date().toISOString() }).eq('grade', grade).eq('name', name).eq('semester', semester);
}
async function loadAllForTeacher(semester) {
  let q = db.from('fitness_records').select('*');
  if (semester !== '전체') q = q.eq('semester', semester);
  const { data } = await q;
  return data || [];
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e[k] = v;
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function wrap(wide, ...children) {
  return el('div', { class: 'wrap' },
    el('div', { class: wide ? 'card card-wide' : 'card' }, ...children)

// ── SURVEY ──
function renderSurvey() {
  const { step, ans } = state;
  const q = SURVEY[step];
  const pct = (step / SURVEY.length) * 100;

  const header = el('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '6px' } },
    el('span', { style: { fontSize: '12px', color: '#888', fontWeight: '700' } }, `${step + 1} / ${SURVEY.length}`),
    el('span', { style: { fontSize: '12px', color: q.color, fontWeight: '800' } }, `${q.emoji} ${q.label}`)
  );

  const bar = el('div', { class: 'progress-bar-bg', style: { marginBottom: '24px' } },
    el('div', { class: 'progress-bar', style: { background: q.color, width: `${pct}%` } })
  );

  const optBtns = q.options.map(opt => {
    const b = el('button', {
      class: 'btn',
      style: { background: ans[q.id] === opt.score ? q.color : '#F5F5F5', color: ans[q.id] === opt.score ? '#fff' : '#333', display: 'flex', alignItems: 'center', gap: '12px', textAlign: 'left', padding: '16px 18px', borderRadius: '12px', fontSize: '14px' }
    }, el('span', { style: { fontSize: '28px' } }, opt.emoji), el('span', null, opt.label));
    b.onclick = async () => {
      const na = { ...ans, [q.id]: opt.score };
      if (step < SURVEY.length - 1) {
        setState({ step: step + 1, ans: na });
      } else {
        setState({ sc: 'loading' });
        const scores = {};
        SURVEY.forEach(x => { scores[x.id] = na[x.id] || 1; });
        const newLevel = calcLevel(scores);
        const prevLevel = state.rec?.level;
        const prevBadges = calcBadges(state.allRecs, state.rec);
        await saveRecord(state.grade, state.name, state.sem, scores, newLevel, state.rec?.activities || {});
        const rec = await loadRecord(state.grade, state.name, state.sem);
        const allRecs = await loadAllRecords(state.grade, state.name);
        const newBadgeIds = calcBadges(allRecs, rec);
        const justEarned = newBadgeIds.filter(id => !prevBadges.includes(id));
        const lvUpAnim = prevLevel && newLevel > prevLevel ? { prevLevel, newLevel } : null;
        setState({ sc: 'result', rec, allRecs, ans: na,
          lvUpAnim, newBadges: BADGES.filter(b => justEarned.includes(b.id)),
          showBadgeAnim: justEarned.length > 0 });
      }
    };
    return b;
  });

  const prevBtn = step > 0 ? el('button', { style: { background: 'none', border: 'none', color: '#999', fontSize: '13px', fontWeight: '800', padding: '6px 0 0', cursor: 'pointer', fontFamily: 'Nunito,sans-serif' }, onclick: () => setState({ step: step - 1 }) }, '← 이전 질문') : null;

  return wrap(false, backBtn('sm', '× 그만하기'), header, bar,
    el('h2', { style: { fontSize: '19px', fontWeight: '900', lineHeight: '1.5', margin: '0 0 22px', color: '#1A1A2E' } }, q.question),
    ...optBtns, prevBtn
  );
}

function renderSimpleChart(records) {
  const W = 460, H = 120, PAD = 30;
  const levels = records.map(r => r.level);
  const labels = records.map(r => r.semester.replace('20', "'"));
  const n = records.length;
  const xStep = (W - PAD * 2) / (n - 1);
  const yScale = v => H - PAD - ((v - 1) / 4) * (H - PAD * 2);

  const pts = levels.map((v, i) => [PAD + i * xStep, yScale(v)]);
  const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.width = '100%';
  svg.style.height = '120px';
  svg.style.overflow = 'visible';

  // grid lines
  [1,2,3,4,5].forEach(v => {
    const y = yScale(v);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', PAD); line.setAttribute('x2', W - PAD);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', '#F0F0F0'); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', PAD - 4); txt.setAttribute('y', y + 4);
    txt.setAttribute('text-anchor', 'end'); txt.setAttribute('font-size', '10'); txt.setAttribute('fill', '#CCC');
    txt.textContent = v;
    svg.appendChild(txt);
  });

  // path
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', pathD); path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#E8534A'); path.setAttribute('stroke-width', '2.5');
  svg.appendChild(path);

  // dots + labels
  pts.forEach(([x, y], i) => {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', '5');
    circle.setAttribute('fill', '#E8534A');
    svg.appendChild(circle);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x); lbl.setAttribute('y', H - 4);
    lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '10'); lbl.setAttribute('fill', '#888');
    lbl.textContent = labels[i];
    svg.appendChild(lbl);
    const vlbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    vlbl.setAttribute('x', x); vlbl.setAttribute('y', y - 8);
    vlbl.setAttribute('text-anchor', 'middle'); vlbl.setAttribute('font-size', '11'); vlbl.setAttribute('fill', '#E8534A'); vlbl.setAttribute('font-weight', '800');
    vlbl.textContent = `Lv.${levels[i]}`;
    svg.appendChild(vlbl);
  });

  return el('div', { style: { padding: '8px 0' } }, svg);
}

    ...LEVELS.map((l, i) => el('div', { style: { background: l.bg, borderRadius: '12px', padding: '10px 4px', textAlign: 'center' } },
      el('div', { style: { fontSize: '22px' } }, l.emoji),
      el('div', { style: { fontWeight: '900', fontSize: '20px', color: l.color } }, lvCnt[i]),
      el('div', { style: { fontSize: '10px', fontWeight: '700', color: '#888' } }, l.name)
    ))
  );

  const stats = el('div', { style: { display: 'flex', gap: '10px', marginBottom: '20px' } },
    el('div', { class: 'stat-box', style: { background: '#F0FDF4' } },
      el('div', { style: { fontSize: '22px', fontWeight: '900', color: '#16A34A' } }, avgLv),
      el('div', { style: { fontSize: '11px', color: '#888', fontWeight: '700' } }, '평균 레벨')
    ),
    el('div', { class: 'stat-box', style: { background: '#EEF2FF' } },
      el('div', { style: { fontSize: '22px', fontWeight: '900', color: '#4338CA' } }, filt.length),
      el('div', { style: { fontSize: '11px', color: '#888', fontWeight: '700' } }, '측정 완료')
    ),
    el('div', { class: 'stat-box', style: { background: '#FFF7ED' } },
      el('div', { style: { fontSize: '22px', fontWeight: '900', color: '#C2410C' } }, filt.filter(r => (r.level || 0) <= 2).length),
      el('div', { style: { fontSize: '11px', color: '#888', fontWeight: '700' } }, '집중 관리')
    )
  );

  const studentList = filt.length === 0
    ? el('div', { style: { textAlign: 'center', padding: '36px 0', color: '#CCC' } },
        el('p', { style: { fontSize: '40px', margin: '0 0 8px' } }, '📭'),
        el('p', { style: { fontWeight: '700', margin: '0' } }, '데이터가 없어요')
      )
    : el('div', null,
        el('p', { class: 'section-title' }, '👥 학생 목록'),
        ...filt.sort((a, b) => (b.level || 0) - (a.level || 0)).map(r => {
          const lv = LEVELS[(r.level || 1) - 1];
          const dn = Object.values(r.activities || {}).filter(Boolean).length;
          const wk = getWeakCats(r.scores || {});
          return el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 0', borderBottom: '1px solid #F5F5F5' } },
            el('div', { style: { width: '40px', height: '40px', borderRadius: '10px', background: lv.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '21px', flexShrink: '0' } }, lv.emoji),
            el('div', { style: { flex: '1', minWidth: '0' } },
              el('div', { style: { display: 'flex', alignItems: 'center', gap: '7px', flexWrap: 'wrap' } },
                el('span', { style: { fontWeight: '900', fontSize: '14px', color: '#1A1A2E' } }, `${r.grade} ${r.name}`),
                el('span', { class: 'tag', style: { background: lv.color + '22', color: lv.color } }, lv.name)
              ),
              el('div', { style: { fontSize: '11px', color: '#999', marginTop: '2px' } },
                `측정: ${r.survey_date} · 활동 ${dn}/${ALL_ACTS_TOTAL}개`,
                wk.length > 0 ? el('span', { style: { color: '#E8534A' } }, ` · 약점: ${wk.map(k => ACTIVITIES[k].label).join(', ')}`) : ''
              )
            ),
            el('div', { style: { display: 'flex', gap: '3px', flexShrink: '0' } },
              ...SURVEY.map(q => {
                const sv = r.scores?.[q.id] || 1;
                return el('div', { title: q.label, style: { width: '12px', height: '12px', borderRadius: '50%', background: sv === 5 ? '#4CAF50' : sv === 3 ? '#FF9800' : '#E8534A' } });
              })
            )
          );
        }),
        el('p', { style: { fontSize: '10px', color: '#CCC', textAlign: 'center', marginTop: '12px' } }, '● 초록: 우수 · 주황: 보통 · 빨강: 노력 필요')
      );

  const homeBtn = el('button', { style: { background: 'none', border: 'none', color: '#999', fontSize: '13px', fontWeight: '800', cursor: 'pointer', fontFamily: 'Nunito,sans-serif' } }, '← 홈으로');
  homeBtn.onclick = () => setState({ sc: 'home' });

  return wrap(true,
    el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' } },
      el('div', null,
        el('h2', { style: { fontSize: '21px', fontWeight: '900', margin: '0', color: '#1A1A2E' } }, '👩‍🏫 학급 현황'),
        el('p', { style: { margin: '3px 0 0', color: '#888', fontSize: '12px', fontWeight: '600' } }, `총 ${filt.length}명`)
      ),
      el('div', { style: { display: 'flex', gap: '8px' } }, refreshBtn, homeBtn)
    ),
    gradeFilter, semFilter, lvBoxes, stats, studentList
  );
}

// ── LOADING ──
function renderLoading() {
  return wrap(false,
    el('div', { style: { textAlign: 'center', padding: '40px 0' } },
      el('div', { class: 'spinner' }),
      el('p', { style: { color: '#888', fontWeight: '700' } }, '불러오는 중...')
    )
  );
}

// ── OVERLAYS ──
function renderLvUpOverlay() {
  const { lvUpAnim } = state;
  const lv = LEVELS[lvUpAnim.newLevel - 1];
  const overlay = el('div', { class: 'overlay' },
    el('div', { class: 'popup', style: { background: lv.bg, border: `3px solid ${lv.color}` } },
      el('div', { style: { fontSize: '72px', marginBottom: '8px' } }, lv.emoji),
      el('div', { style: { fontSize: '13px', fontWeight: '800', color: lv.color, marginBottom: '4px' } }, 'LEVEL UP! 🎉'),
      el('div', { style: { fontSize: '26px', fontWeight: '900', color: '#1A1A2E', marginBottom: '8px' } }, `${LEVELS[lvUpAnim.prevLevel-1].name} → ${lv.name}`),
      el('p', { style: { color: '#555', fontWeight: '700', margin: '0 0 20px' } }, lv.desc),
      el('button', { class: 'btn', style: { background: lv.color, width: 'auto', padding: '12px 28px' }, onclick: () => setState({ lvUpAnim: null }) }, '🎉 확인!')
    )
  );
  return overlay;
}

function renderBadgeOverlay() {
  const { newBadges } = state;
  const overlay = el('div', { class: 'overlay', onclick: () => setState({ showBadgeAnim: false, newBadges: [] }) },
    el('div', { class: 'popup' },
      el('div', { style: { fontSize: '56px' } }, '🏅'),
      el('div', { style: { fontSize: '19px', fontWeight: '900', margin: '8px 0' } }, '새 배지 획득!'),
      ...newBadges.map(b => el('div', { style: { background: '#FFF9E6', border: '2px solid #FFC107', borderRadius: '10px', padding: '8px 12px', margin: '6px 0' } },
        el('span', { style: { fontSize: '22px' } }, b.emoji),
        el('div', { style: { fontWeight: '800', fontSize: '14px' } }, b.name)
      )),
      el('button', { class: 'btn', style: { background: '#FFC107', width: 'auto', padding: '10px 24px', marginTop: '8px' }, onclick: () => setState({ showBadgeAnim: false, newBadges: [] }) }, '축하해요!')
    )
  );
  return overlay;
}

// ── INIT ──
render();
</script>
</body>
</html>
